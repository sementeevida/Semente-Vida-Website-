# Mantém o Supabase (plano gratuito) ativo: o projeto é pausado após 7 dias sem uso.
# A cada 3 dias faz uma consulta mínima, só de leitura, com a chave PÚBLICA (a mesma do index.html).
# A chave secreta (secret/service_role) nunca entra aqui.
name: Manter Supabase ativo

on:
  schedule:
    - cron: '0 12 */3 * *'   # a cada 3 dias, 12h UTC (9h de Brasília)
  workflow_dispatch:          # botão "Run workflow" para testar na hora

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve ao banco (só leitura)
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "https://lgalkupnzsommnqzcvjl.supabase.co/rest/v1/categorias?select=id&limit=1" \
            -H "apikey: sb_publishable_G2D8YGcrclZA_B6YcR-Pwg_Vx3-ODUT" \
            -H "Authorization: Bearer sb_publishable_G2D8YGcrclZA_B6YcR-Pwg_Vx3-ODUT"
